<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DevCraft Meme Studio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <div class="bg-grid"></div>
        <header class="hero">
            <p class="kicker">Template Generator</p>
            <h1>DevCraft Meme Studio</h1>
            <p class="subtitle">
                Pick a template, add captions, and generate an image you can
                share by token.
            </p>
        </header>

        <main class="layout">
            <section class="card">
                <h2>Generate Image</h2>
                <form id="generate-form" class="form">
                    <label>
                        Template
                        <select id="template-select" required></select>
                    </label>
                    <label>
                        Top text
                        <input
                            type="text"
                            id="top-text"
                            placeholder="WHEN THE BUG IS..."
                        />
                    </label>
                    <label>
                        Bottom text
                        <input
                            type="text"
                            id="bottom-text"
                            placeholder="...IN PRODUCTION"
                        />
                    </label>
                    <button type="submit">Generate</button>
                </form>
                <p id="generate-status" class="hint"></p>
            </section>

            <section class="card wide">
                <h2>Generated Images</h2>
                <div id="generated-list" class="gallery"></div>
            </section>
        </main>

        <div id="toast" class="toast" aria-live="polite"></div>
        <script src="/static/app.js" defer></script>
    </body>
</html>
