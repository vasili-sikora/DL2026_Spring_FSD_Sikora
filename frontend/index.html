<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DevCraft Meme Studio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <div class="bg-grid"></div>
        <header class="hero">
            <p class="kicker">Template Generator</p>
            <h1>DevCraft Meme Studio</h1>
            <p class="subtitle">
                Pick a template, add captions, and generate an image you can
                share by token.
            </p>
        </header>

        <main class="layout">
            <section class="card">
                <h2>Generate Image</h2>
                <form id="generate-form" class="form">
                    <label>
                        Template
                        <div
                            id="template-picker"
                            class="template-picker"
                            role="radiogroup"
                            aria-label="Template"
                        ></div>
                        <input type="hidden" id="template-select" required />
                    </label>
                    <label>
                        Top text
                        <input
                            type="text"
                            id="top-text"
                            placeholder="WHEN THE BUG IS..."
                        />
                    </label>
                    <label>
                        Bottom text
                        <input
                            type="text"
                            id="bottom-text"
                            placeholder="...IN PRODUCTION"
                        />
                    </label>
                    <label>
                        Font
                        <select id="font-name">
                            <option value="dejavu_sans" selected>
                                DejaVu Sans
                            </option>
                            <option value="dejavu_serif">DejaVu Serif</option>
                            <option value="dejavu_mono">DejaVu Mono</option>
                        </select>
                    </label>
                    <label>
                        Font size
                        <input
                            type="number"
                            id="font-size"
                            min="12"
                            max="120"
                            value="40"
                        />
                    </label>
                    <button type="submit">Generate</button>
                </form>
                <p id="generate-status" class="hint"></p>
            </section>

            <section class="card template-preview-panel">
                <h2>Template Preview</h2>
                <aside class="template-preview" aria-live="polite">
                    <img
                        id="template-preview-image"
                        alt="Selected template preview"
                    />
                    <p
                        id="template-preview-name"
                        class="template-preview__name"
                    ></p>
                    <a
                        id="preview-download"
                        class="download-button disabled"
                        href="#"
                        download="preview.jpg"
                        aria-disabled="true"
                    >
                        Download Preview
                    </a>
                </aside>
            </section>

            <section class="card wide">
                <h2>Generated Images</h2>
                <div id="generated-list" class="gallery"></div>
            </section>
        </main>

        <div id="toast" class="toast" aria-live="polite"></div>
        <script src="/static/app.js" defer></script>
    </body>
</html>
